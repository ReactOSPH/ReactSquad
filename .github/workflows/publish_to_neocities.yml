name: Publish to reactsquad.neocities.org

# runs when committed to prod
on:
  workflow_dispatch:
  push:
    branches: ["staging"]
    # run changes on a specific directory.
    # time to bring that back somehow.
    paths:
      - 'prod/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Neocities + GitHub (GitHub Actions)
      uses: actions/checkout@main
      with:
        lfs: true
    - name: Prepare blank index for cleanup # according to NeoCities, index.html **MUST NOT** be deleted
      run: |
        mkdir -p neocities-empty
        : > neocities-empty/index.html
    - name: Clear Neocities files
      uses: bcomnes/deploy-to-neocities@master
      with:
        api_key: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
        cleanup: true
        dist_dir: neocities-empty
    - name: Remove remote directories # DESTRUCTIVELY REMOVE EVERYTHING (except index.html)
      env:
        NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
      run: |
        remote_listing="$(curl --fail --silent --show-error \
          --header "Authorization: Bearer $NEOCITIES_API_KEY" \
          "https://neocities.org/api/list?path=%2F")"
        printf '%s\n' "$remote_listing" | jq -e '.result == "success"' > /dev/null

        directories="$(printf '%s\n' "$remote_listing" |
          jq -r '.files[] | select(.is_directory) | .path')"
        if [ -n "$directories" ]; then
          delete_args=()
          while IFS= read -r directory; do
            [ -n "$directory" ] && delete_args+=(--data-urlencode "filenames[]=$directory")
          done <<< "$directories"
          delete_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $NEOCITIES_API_KEY" \
            --request POST \
            "${delete_args[@]}" \
            https://neocities.org/api/delete)"
          printf '%s\n' "$delete_response" | jq -e '.result == "success"' > /dev/null
        fi
    - name: Publish prod to Neocities
      uses: bcomnes/deploy-to-neocities@master
      with:
        api_key: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
        cleanup: true
        dist_dir: prod

# dependency workaround by bechnokid/neocities