name: Publish to reactsquad.neocities.org

# runs when committed to staging
on:
  workflow_dispatch:
  push:
    branches: ["staging"]
    # run changes on a specific directory
    paths:
      - 'staging/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Neocities + GitHub (GitHub Actions)
      uses: actions/checkout@main
      with:
        lfs: true
    - name: Prepare blank index for cleanup
      run: |
        mkdir -p "$RUNNER_TEMP/neocities-empty"
        : > "$RUNNER_TEMP/neocities-empty/index.html"
    - name: Clear Neocities files
      uses: bcomnes/deploy-to-neocities@master
      with:
        api_key: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
        cleanup: true
        dist_dir: ${{ runner.temp }}/neocities-empty
    - name: Publish staging to Neocities
      uses: bcomnes/deploy-to-neocities@master
      with:
        api_key: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
        cleanup: true
        dist_dir: staging

# dependency workaround by bechnokid/neocities