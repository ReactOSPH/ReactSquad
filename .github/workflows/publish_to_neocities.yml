name: Publish to reactsquad.neocities.org

# runs when committed to staging
on:
  workflow_dispatch:
  push:
    branches: ["staging"]
    # run changes on a specific directory
    paths:
      - 'staging/**'

concurrency:
  group: neocities-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Neocities + GitHub (GitHub Actions)
      uses: actions/checkout@main
      with:
        lfs: true
    - name: Clear existing Neocities files
      run: mkdir -p .neocities-empty
    - name: Delete existing Neocities files
      uses: bcomnes/deploy-to-neocities@master
      with:
        api_key: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
        cleanup: true
        dist_dir: .neocities-empty
    - name: Publish staging to Neocities
      uses: bcomnes/deploy-to-neocities@master
      with:
        api_key: ${{ secrets.NEOCITIES_API_REACTSQUAD }}
        cleanup: true
        dist_dir: staging

# dependency workaround by bechnokid/neocities